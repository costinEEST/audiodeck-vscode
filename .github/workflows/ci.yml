name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-package:
    name: Validate and package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and compile
        run: npm run check

      - name: Verify release version
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          vsix_name="audio-deck-${version}.vsix"

          if ! grep -Fq "$vsix_name" README.md; then
            echo "README.md must mention the current package filename: $vsix_name" >&2
            exit 1
          fi

          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v${version}" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version ${version}." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "vsix_name=$vsix_name" >> "$GITHUB_OUTPUT"

      - name: Build VSIX
        run: npm run package

      - name: Verify packaged filename
        run: test -f "${{ steps.version.outputs.vsix_name }}"

      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.vsix_name }}
          path: ${{ steps.version.outputs.vsix_name }}
          if-no-files-found: error
          retention-days: 14
          archive: false

  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate-and-package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged VSIX
        uses: actions/download-artifact@v8
        with:
          pattern: audio-deck-*.vsix
          merge-multiple: true

      - name: Create release and upload VSIX
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" audio-deck-*.vsix --verify-tag --generate-notes --title "AudioDeck $GITHUB_REF_NAME"
